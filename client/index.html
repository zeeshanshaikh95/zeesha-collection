<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand typography: high-contrast serif + clean geometric sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons / app icons derived from the house mark -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#073A2F" />

    <title>Zeesha Collection — Premium Abayas &amp; Burkhas</title>
    <meta
      name="description"
      content="Zeesha Collection — premium abayas, burkhas, hijabs and pashmina, chosen for elegant, trend-forward modest dressing. Delivery all over India. Enquire on Instagram."
    />
    <!--
      Site-wide social card. WhatsApp / Facebook / Twitter scrapers do not run
      JavaScript, so these static tags are what they read for ANY url — values
      must be absolute. Per-page metadata is added by the app (Helmet) for
      JS-capable crawlers such as Google.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zeesha Collection" />
    <meta property="og:title" content="Zeesha Collection — Premium Abayas &amp; Burkhas" />
    <meta
      property="og:description"
      content="Elegant • Trendy • Comfortable. Premium abayas, burkhas, hijabs and pashmina, delivered all over India."
    />
    <meta property="og:url" content="https://zeeshanshaikh95.github.io/zeesha-collection/" />
    <meta
      property="og:image"
      content="https://zeeshanshaikh95.github.io/zeesha-collection/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zeesha Collection — premium abayas and burkhas" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
